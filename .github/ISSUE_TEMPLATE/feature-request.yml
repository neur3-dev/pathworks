name: PathWorks feature request
labels: ['enhancement']
description: Suggest a participant, counselor, or operator workflow improvement
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a PathWorks user be able to do?
    validations:
      required: true
  - type: textarea
    id: user
    attributes:
      label: User role and context
      description: Participant, counselor, operator, or admin. Include the route/workflow if known.
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility considerations
      description: Timing, plain language, captions, keyboard access, content warnings, or assistive technology needs.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or constraints
