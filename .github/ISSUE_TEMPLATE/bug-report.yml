name: PathWorks bug report
labels: ['bug']
description: Report something that is broken or confusing in PathWorks
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve PathWorks. Share what happened and how we can reproduce it.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the bug and who it affects.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include account role, route, clicks, and any test data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, device, local/preview/production, and any relevant flags.
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility impact
      description: Note keyboard, screen reader, captions, timing, or motion issues if relevant.
