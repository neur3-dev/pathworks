name: PathWorks improvement
labels: ['improvement']
description: Suggest a small product, docs, CI, or maintenance improvement
body:
  - type: textarea
    id: improvement
    attributes:
      label: Improvement
      description: What should be cleaner, clearer, faster, or safer?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why it matters
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How we would verify it
